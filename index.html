      <!-- 作者卡片 -->
      <div class="sidebar-card author-card">
        <img class="avatar" src="img/avatar.svg" alt="头像" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22 rx=%2250%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2240%22>👤</text></svg>'">

          <a class="social-btn" href="https://space.bilibili.com/XXXXXX" target="_blank" rel="noopener"><i class="fab fa-bilibili"></i> B站</a>
        </div>
      </div>

      <!-- 公告卡片 -->
      <div class="sidebar-card">
        <div class="sidebar-title">📢 公告</div>
        <div id="sidebar-announcement" style="font-size:0.85rem;color:var(--text-light);line-height:1.6;"></div>
      </div>

      <!-- 最新文章 -->
      <div class="sidebar-card">
        <div class="sidebar-title">📝 最新文章</div>
        <ul id="sidebar-recent"></ul>
      </div>

      <!-- 站点统计 -->
      <div class="sidebar-card">
        <div class="sidebar-title">📊 站点统计</div>
        <div class="stat-item"><span>文章总数</span><span id="stat-posts">0</span></div>
        <div class="stat-item"><span>分类数目</span><span id="stat-categories">0</span></div>
        <div class="stat-item"><span>标签数目</span><span id="stat-tags">0</span></div>

  <main class="main">
    <div class="card-grid" id="post-grid"></div>

<!-- ===== 页脚 ===== -->
<footer class="footer">

<script src="js/config.js"></script>
<script src="js/posts.js"></script>
<script src="js/main.js"></script>
<script>
  // 首页渲染
  const params = new URLSearchParams(window.location.search);
  const page = parseInt(params.get('page')) || 1;
  renderCardGrid('post-grid', POSTS, page);

  // 运行天数
  const since = new Date(SITE_CONFIG.siteSince, 0, 1);
  const days = Math.floor((new Date() - since) / (1000 * 60 * 60 * 24));
  document.getElementById('stat-days').textContent = days;
</script>
